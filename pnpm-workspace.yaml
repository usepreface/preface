  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "effect": 4.0.5
  "klarity": 0.3.0
  "publint": 0.3.25
  "react": 19.3.1
  "react-dom": 19.3.1
  "tailwindcss": 4.3.3
  "tsdown": 0.23.1
  "typescript": 7.0.2
  "vitest": 5.0.5

minimumReleaseAgeExclude:
  - "effect"
  - "@effect/*"

patchedDependencies:
  drizzle-orm@1.0.0-rc.4: patches/drizzle-orm@1.0.0-rc.4.patch
