  "@commitlint/config-conventional": 21.2.3
  "@effect/platform-node": 4.0.5
  "@effect/sql-pg": 4.0.5
  "@effect/sql-pglite": 4.0.5
  "@effect/vitest": 4.0.5
  "@electric-sql/pglite": 0.5.10
  "@types/node": 24.19.2
