  "effect": 4.0.5
  "klarity": 0.3.0
  "lefthook": 2.2.2
  "oxfmt": 0.73.0
  "oxlint": 1.88.0
  "pg": 8.23.1
  "publint": 0.3.25
  "tsdown": 0.23.1
  "turbo": 2.11.8
  "typescript": 7.0.2
  "uuid": 14.0.3
