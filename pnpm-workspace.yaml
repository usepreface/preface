packages:
  - apps/*
  - packages/*

catalogMode: strict
engineStrict: true

allowBuilds:
  esbuild: true
  lefthook: true

catalog:
  "@commitlint/cli": 21.2.3
  "@commitlint/config-conventional": 21.2.3
  "@types/node": 24.19.2
  "drizzle-kit": 1.0.0-rc.4
  "drizzle-orm": 1.0.0-rc.4
  "effect": 4.0.5
  "klarity": 0.3.0
  "lefthook": 2.2.2
  "oxfmt": 0.73.0
  "oxlint": 1.88.0
  "publint": 0.3.25
  "tsdown": 0.23.1
  "turbo": 2.11.8
  "typescript": 7.0.2

minimumReleaseAgeExclude:
  - "effect"
  - "@effect/*"
