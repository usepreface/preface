services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-preface}
      POSTGRES_DB: ${POSTGRES_DATABASE:-preface}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-preface}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
